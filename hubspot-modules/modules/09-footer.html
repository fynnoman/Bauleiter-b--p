<!-- ============================================================
     MODUL 09 – FOOTER
     Drop-Zone: volle Breite (12/12), letzte Zone
     Enthält: b+p Logo + Untertitel links, Impressum/Datenschutz-Links
              rechts, Copyright-Zeile darunter.
     BILDER TAUSCHEN: bp-logo.jpg über HubSpot File Manager hochladen
                      und URL im <img src="..."> einsetzen.
     ============================================================ -->
<section class="bp-footer">
  <div class="bp-footer__inner">
    <div class="bp-footer__row">
      <div class="bp-footer__brand">
        <img src="https://personalberatung.b--p.de/hubfs/0b-p_Logo_238x120.png" alt="b+p Beratung und Personal">
        <div class="bp-footer__subtitle">b+p Beratung und Personal</div>
      </div>

      <div class="bp-footer__links">
        <a href="#">Impressum</a>
        <a href="#">Datenschutz</a>
      </div>
    </div>

    <div class="bp-footer__copy" id="bp-footer-copy">
      © <span id="bp-footer-year">2026</span> b+p Beratung und Personal. Alle Rechte vorbehalten.
    </div>
  </div>
</section>

<style>
/* Schriften werden zentral in 01-nav geladen */
.bp-footer{
  --page:#FAF7F1;
  --ink:#1A1A1A;
  --ink-soft:#2E2E2C;
  --ink-muted:#6B6B68;
  --line:#E5E1D8;
  --accent:#2F6DB3;
  --font-sans:"Inter Tight","Inter",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;

  width:100vw;
  margin-left:50%;
  transform:translateX(-50%);
  max-width:100vw;

  background:var(--page);
  border-top:1px solid var(--line);
  color:var(--ink-soft);
  font-family:var(--font-sans);
  font-size:14px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.bp-footer *,
.bp-footer *::before,
.bp-footer *::after{ box-sizing:border-box; }
.bp-footer img{ display:block; max-width:100%; }
.bp-footer a{ color:inherit; text-decoration:none; transition:color 200ms ease; }
.bp-footer a:hover{ color:var(--accent); }

.bp-footer__inner{
  max-width:1152px;
  margin:0 auto;
  padding:40px 24px;
}
.bp-footer__row{
  display:flex; align-items:center; justify-content:space-between;
  gap:24px;
  flex-wrap:wrap;
}
.bp-footer__brand{
  display:flex; align-items:center; gap:16px;
}
.bp-footer__brand img{ height:48px; width:auto; }
.bp-footer__subtitle{
  font-size:12px; color:var(--ink-muted);
}
.bp-footer__links{
  display:flex; gap:24px;
  font-size:14px;
}

.bp-footer__copy{
  margin-top:24px;
  padding-top:24px;
  border-top:1px solid var(--line);
  font-size:12px;
  color:var(--ink-muted);
}

@media (max-width:520px){
  .bp-footer__brand{ gap:12px; }
  .bp-footer__brand img{ height:40px; }
  .bp-footer__subtitle{ display:none; }
}
</style>

<script>
(function(){
  var wraps = document.querySelectorAll('.bp-footer');
  var wrap = wraps[wraps.length - 1];
  if(!wrap) return;
  var y = wrap.querySelector('#bp-footer-year');
  if(y) y.textContent = String(new Date().getFullYear());
})();
</script>
